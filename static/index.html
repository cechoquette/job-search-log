<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Search Log</title>

    <style>
        body {
            background-color: #1e1e1e;
            color: #eeeeee;
        }

        input,
        select,
        button {
            background-color: #2d2d2d;
            color: #eeeeee;
            border: 1px solid #666666;
        }
    </style>
</head>

<body>
    <h1>Job Search Log</h1>

    <label for="description">What did you do?</label>
    <br>
    <input
        id="description"
        type="text"
        size="60"
    >
    <br><br>

    <label for="date">Date</label>
    <br>
    <input id="date" type="date">
    <br><br>

    <label>Duration</label>
    <br>
<!--    <input-->
<!--        id="duration"-->
<!--        type="number"-->
<!--        min="15"-->
<!--        step="15"-->
<!--        value="30"-->
<!--    >-->
<!--    <br><br>-->
    <button id="duration-down" type="button">▼</button>

    <span id="duration-display">0H30</span>

    <button id="duration-up" type="button">▲</button>
    <br><br>

    <label for="url">URL</label>
    <br>
    <input
        id="url"
        type="url"
        size="60"
    >
    <br><br>

    <label for="category">Category</label>
    <br>
    <select id="category">
        <option value="job-search">Job Search / Research</option>
        <option value="resume">Résumé / Cover Letter</option>
        <option value="portfolio">Portfolio / Work Samples</option>
        <option value="application">Application</option>
        <option value="networking">Networking</option>
        <option value="employer-contact">Employer Contact</option>
        <option value="interview-prep">Interview Prep</option>
        <option value="interview">Interview</option>
        <option value="job-search-tools">Job Search Tools</option>
        <option value="career-event">Workshop / Job Fair / Career Event</option>
        <option value="skills">Skills / Competency Development</option>
    </select>
    <br><br>

    <button id="save">Save Activity</button>
    <script type="module" src="../dist/renderer/renderer.js"></script>
</body>
</html>
